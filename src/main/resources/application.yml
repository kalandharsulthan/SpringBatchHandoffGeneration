spring:
  application:
    name: handoff-generation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/prod_support_ai
    username: ${DB_USERNAME:ai_user}
    password: ${DB_PASSWORD:ai_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080

handoff:
  output:
    directory: /tmp/handoff-output
    encoding: UTF-8

  batch:
    chunk-size: 1000
    page-size: 1000
    skip-limit: 10

  # ── Job 1: Data population (two steps) ───────────────────────────────────
  # Step 1: instrument_header → instrument_header_staging
  instrument-staging:
    table-name: instrument_header_staging
    source:
      select-clause: "instrument_id, collection_number, business_date, draw_reference_number, instrument_amount, bank_code"
      from-clause: "instrument_header"
      where-clause: "instrument_status = 'ACTIVE'"
      sort-key: instrument_id
    columns:
      - instrument_id
      - collection_number
      - business_date
      - draw_reference_number
      - instrument_amount
      - bank_code

  # Step 2: accounting_entry → accounting_staging
  accounting-staging:
    table-name: accounting_staging
    source:
      select-clause: "instrument_number, collection_number, accounting_status, debit_amount, credit_amount, bank_code, value_date"
      from-clause: "accounting_entry"
      where-clause: "entry_status = 'PENDING'"
      sort-key: instrument_number
    columns:
      - instrument_number
      - collection_number
      - accounting_status
      - debit_amount
      - credit_amount
      - bank_code
      - value_date

  # ── Job 2: Instrument feed ─────────────────────────────────────────────────
  # Query loaded at runtime from feed_query_config table (feed_name = 'INSTRUMENT_FEED').
  # format: FIXED_WIDTH | CSV
  instrument:
    enabled: true
    format: FIXED_WIDTH
    output:
      file-prefix: INSTRUMENT_FEED_
      file-suffix: .dat
    fields:
      - name: instrument_id
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: collection_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: business_date
        length: 10
        alignment: LEFT
        pad-char: " "
      - name: draw_reference_number
        length: 30
        alignment: LEFT
        pad-char: " "
      - name: instrument_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: bank_code
        length: 10
        alignment: LEFT
        pad-char: " "

  # ── Job 3: Accounting feed ─────────────────────────────────────────────────
  # Query loaded at runtime from feed_query_config table (feed_name = 'ACCOUNTING_FEED').
  # format: FIXED_WIDTH | CSV
  accounting:
    enabled: true
    format: CSV
    output:
      file-prefix: ACCOUNTING_FEED_
      file-suffix: .csv
    fields:
      - name: instrument_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: collection_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: accounting_status
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: debit_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: credit_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: bank_code
        length: 10
        alignment: LEFT
        pad-char: " "
      - name: value_date
        length: 10
        alignment: LEFT
        pad-char: " "

logging:
  level:
    com.banking.handoff: DEBUG
    org.springframework.batch: INFO
