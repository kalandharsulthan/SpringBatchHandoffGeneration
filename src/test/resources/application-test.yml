spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

handoff:
  output:
    directory: ${java.io.tmpdir}/handoff-test
    encoding: UTF-8

  batch:
    chunk-size: 10
    page-size: 10
    skip-limit: 5

  instrument-staging:
    table-name: test_instrument_header_staging
    source:
      select-clause: "instrument_id, collection_number, business_date, draw_reference_number, instrument_amount, bank_code"
      from-clause: "test_instrument_header"
      where-clause: "instrument_status = 'ACTIVE'"
      sort-key: instrument_id
    columns:
      - instrument_id
      - collection_number
      - business_date
      - draw_reference_number
      - instrument_amount
      - bank_code

  accounting-staging:
    table-name: test_accounting_staging
    source:
      select-clause: "instrument_number, collection_number, accounting_status, debit_amount, credit_amount, bank_code, value_date"
      from-clause: "test_accounting_entry"
      where-clause: "entry_status = 'PENDING'"
      sort-key: instrument_number
    columns:
      - instrument_number
      - collection_number
      - accounting_status
      - debit_amount
      - credit_amount
      - bank_code
      - value_date

  instrument:
    enabled: true
    format: FIXED_WIDTH
    output:
      file-prefix: TEST_INSTRUMENT_FEED_
      file-suffix: .dat
    fields:
      - name: instrument_id
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: collection_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: business_date
        length: 10
        alignment: LEFT
        pad-char: " "
      - name: draw_reference_number
        length: 30
        alignment: LEFT
        pad-char: " "
      - name: instrument_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: bank_code
        length: 10
        alignment: LEFT
        pad-char: " "

  accounting:
    enabled: true
    format: CSV
    output:
      file-prefix: TEST_ACCOUNTING_FEED_
      file-suffix: .csv
    fields:
      - name: instrument_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: collection_number
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: accounting_status
        length: 20
        alignment: LEFT
        pad-char: " "
      - name: debit_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: credit_amount
        length: 15
        alignment: RIGHT
        pad-char: "0"
        format: "%.2f"
      - name: bank_code
        length: 10
        alignment: LEFT
        pad-char: " "
      - name: value_date
        length: 10
        alignment: LEFT
        pad-char: " "
